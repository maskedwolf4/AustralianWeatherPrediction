[project]
name = "australian-weatherprediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maskedwolf4", email = "meetwadekar7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "setuptools>=84.2.1",
    "xgboost>=3.4.1",
]

[project.scripts]
australian-weatherprediction = "australian_weatherprediction:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
